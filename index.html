<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TaskFlow - Todo Manager</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="app-background">
      <div class="background-orb orb-one"></div>
      <div class="background-orb orb-two"></div>
    </div>

    <main class="app">
      <!-- Header -->
      <header class="app-header">
        <div>
          <p class="eyebrow">PERSONAL WORKSPACE</p>
          <h1>TaskFlow</h1>
          <p class="subtitle">
            Keep your tasks simple, clear, and under control.
          </p>
        </div>

        <!-- <button class="add-task-btn" id="addTaskBtn">
          <span>+</span>
          Add Task
        </button> -->
      </header>

      <!-- Main content -->
      <section class="task-panel">
        <!-- Task statistics -->
        <div class="task-summary">
          <div>
            <span class="summary-label">Today's tasks</span>
            <strong id="taskCount">0</strong>
          </div>

          <div class="progress-container">
            <div class="progress-info">
              <span>Progress</span>
              <span id="progressText">0%</span>
            </div>

            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
        </div>

        <!-- Filters -->
        <nav class="task-filters" aria-label="Task filters">
          <button class="filter-btn active" data-filter="all">All</button>

          <button class="filter-btn" data-filter="active">Active</button>

          <button class="filter-btn" data-filter="completed">Completed</button>
        </nav>

        <!-- Add task form -->
        <form class="task-form" id="taskForm">
          <div class="input-wrapper">
            <input
              type="text"
              id="taskInput"
              placeholder="What needs to be done?"
              autocomplete="off"
            />
            <p id="errorMessage" style="color: red; display: none">
              Please enter a task before submitting!
            </p>
          </div>

          <button type="submit" class="submit-btn">Add</button>
        </form>

        <!-- Task list -->
        <div class="task-list" id="taskList">
          <!-- JavaScript will create tasks here -->
        </div>

        <!-- Empty state -->
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">✓</div>

          <h2>No tasks yet</h2>

          <p>Add something you want to accomplish.</p>
        </div>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
